name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the self-hosted runner be re-verified without opening a PR.
  workflow_dispatch:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    # Self-hosted on `grace`, matching the other cogniumhq repos. The runner is
    # registered per-repo at /opt/gh-runners/cognium-dev and runs as `ghrunner`.
    runs-on: [self-hosted, grace]
    # Container: the runner is persistent, unlike a GitHub-hosted one, so
    # without this the jobs share ~/.npm and leftover node_modules with every
    # other repo on the box. Must stay a glibc image (not alpine):
    # actions/checkout runs on the node binary the runner mounts in, and that
    # binary is glibc-linked.
    container:
      image: node:22-bookworm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # packages/cli and packages/project-profile-detect run their suites
      # under `bun test`, so both runtimes are required.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: npm ci

      # `build:all`, not `build`. Plain `build` is `tsc` only, which leaves
      # packages/circle-ir/dist/wasm empty — and tests/setup.ts loads the
      # tree-sitter grammars from exactly that directory, so every circle-ir
      # test would abort on a missing web-tree-sitter.wasm. `build:all` adds
      # the browser/core bundles, and it is the browser step that copies the
      # grammars into dist/wasm.
      #
      # The build is also what makes the downstream suites work at all:
      # packages/cli resolves `@cognium/project-profile-detect` and
      # packages/mcp-server resolves `circle-ir` through their `main`/`dist`
      # entries. Without this step those two suites fail with module-resolution
      # errors that look like 47 unrelated test failures (see #290).
      - run: npm run build:all

      - run: npm run typecheck

      # Narrow by design: strict tsc already covers types and unused symbols,
      # so this enforces only the correctness rules tsc does not — atomic
      # update races, unreachable/unmodified loops, fallthrough, self-compare.
      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Each workspace reports separately so one red suite does not hide the
      # state of the others. `!cancelled()` keeps the later steps running after
      # an earlier failure, which is the whole point of splitting them.
      #
      # These run with --coverage so the thresholds in each package's config
      # actually gate. Without it the thresholds are decoration: they were
      # configured in packages/circle-ir/vitest.config.ts long before CI ever
      # invoked them.
      - name: test — circle-ir
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/circle-ir

      - name: test — cli
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/cli

      - name: test — mcp-server
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/mcp-server

      # Was the one red suite in this repo (`mergeMavenInheritance — depth cap`,
      # an order-dependent merge). Fixed in #290 / #320, so this step is green
      # and the whole workflow can be a required check.
      - name: test — project-profile-detect
        if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/project-profile-detect

      # Dogfooding: the scanner runs against its own source. A SAST vendor
      # whose CI never runs its own product has no early warning when a
      # regression makes the CLI stop finding things.
      #
      # `scan .` from the package root, not `scan src/`: cognium.config.json
      # matches its `include` globs (`src/**/*.ts`) against paths relative to
      # the scan target, so `scan src/` sees `cli.ts` rather than `src/cli.ts`,
      # matches nothing, and prints "No supported files found" — with exit 0.
      # A gate invoked that way is green because it scanned nothing.
      #
      # --severity high gates on high+critical only. The package is clean at
      # that level today; the one standing finding is a medium (log_injection,
      # CWE-117) which is reported by the unfiltered step below but not gated.
      - name: self-scan — gate on high/critical
        if: ${{ !cancelled() }}
        working-directory: packages/cli
        run: node dist/cli.js scan . --severity high

      # Unfiltered, non-blocking: surfaces the medium/low and quality findings
      # in the log so they stay visible without failing the build.
      - name: self-scan — full report (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: packages/cli
        run: node dist/cli.js scan .

      # Coverage reports are what makes a threshold failure diagnosable — the
      # console summary says a gate moved, the lcov/html says which lines.
      # Kept for 14 days; these are build artifacts, not a record.
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: warn
