name: engine bench

# Engine accuracy regression check on OWASP BenchmarkJava: the PR's circle-ir
# against its base, with the release gate's own tools (the autofix §7 scorer
# .claude/skills/autofix-issues/bench-diff.mts, scripts/bench-gate.mjs) plus
# scripts/bench-fp-gate.mjs for findings added on cases that are not
# vulnerable. Until now this ran by hand at release time only.
#
# Head is the PR's merge commit (what actions/checkout checks out), so base vs
# head is exactly the PR's change. The base snapshot is cached by base commit,
# corpus pin, scorer and lockfile, so most runs scan only the head.

on:
  pull_request:
    paths:
      - 'packages/circle-ir/**'
      # web-tree-sitter and the other engine dependencies are pinned here.
      - 'package-lock.json'
      - '.claude/skills/autofix-issues/bench-diff.mts'
      - '.claude/skills/autofix-issues/fetch-corpora.sh'
      - 'scripts/bench-gate.mjs'
      - 'scripts/bench-fp-gate.mjs'
      - '.github/workflows/engine-bench-pr.yml'
  # Compares the checked-out ref against `base`. Against itself it measures
  # nothing and must read 0 everywhere, which checks the pipeline.
  workflow_dispatch:
    inputs:
      base:
        description: 'Base ref (commit, branch or tag) to compare the checked-out ref against'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: engine-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The most findings the PR may add on OWASP cases marked not vulnerable
  # (expected=false). 0: the corpus and the scorer are deterministic, so any
  # such addition is a new false positive by the benchmark's own definition.
  FP_GAIN_MAX: '0'

jobs:
  owasp:
    name: engine bench (OWASP tp_loss + FP gain)
    # Same runner split as ci.yml: same-repo PRs on the self-hosted `grace`
    # node, fork PRs on ubuntu-latest, never on our persistent box.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "grace"]') }}
    # Same container as ci.yml's heavy jobs, for the same reason: the runner
    # is persistent and must not share ~/.npm or node_modules across repos.
    container:
      image: node:22-bookworm
    timeout-minutes: 75
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
    steps:
      # The repository goes in repo/; the corpus and the snapshots stay outside it.
      - uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # bench-diff loads circle-ir from source with bun, so no build is needed;
      # web-tree-sitter comes from the root node_modules.
      - name: npm ci
        working-directory: repo
        run: npm ci

      - name: Resolve base and corpus pin
        id: keys
        working-directory: repo
        run: |
          set -euo pipefail
          # Persistent runner: never read a previous run's results.
          rm -rf "$GITHUB_WORKSPACE/bench"
          mkdir -p "$GITHUB_WORKSPACE/bench"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
          base="$(git rev-parse --verify --quiet "$BASE_SHA^{commit}" || true)"
          if [ -z "$base" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$(git rev-parse --verify FETCH_HEAD^{commit})"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          pins="$(bash .claude/skills/autofix-issues/fetch-corpora.sh list | awk -F'\t' '$1 == "java"')"
          owasp="$(printf '%s\n' "$pins" | awk -F'\t' '$2 == ".owasp-benchmark-java" { print $4 }')"
          [ -n "$owasp" ] || { echo "no OWASP BenchmarkJava pin in fetch-corpora.sh" >&2; exit 1; }
          echo "owasp=$owasp" >> "$GITHUB_OUTPUT"
          echo "java_pins=$(printf '%s\n' "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # `fetch java` also brings SecuriBench and Juliet Java (the java pin set);
      # only OWASP BenchmarkJava is scanned here.
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: corpora
          key: engine-bench-corpus-java-${{ steps.keys.outputs.owasp }}-${{ steps.keys.outputs.java_pins }}

      - name: Fetch and verify corpus
        working-directory: repo
        run: CORPUS_ROOT="$GITHUB_WORKSPACE/corpora" bash .claude/skills/autofix-issues/fetch-corpora.sh fetch java

      # Keyed on what the base snapshot depends on: the base commit's engine,
      # the corpus, the scorer, and the dependencies the pretree runs on (the
      # pretree links this checkout's node_modules).
      - name: Restore base snapshot
        id: base-cache
        uses: actions/cache@v6
        with:
          path: base-snapshot
          key: engine-bench-owasp-base-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.owasp }}-${{ hashFiles('repo/.claude/skills/autofix-issues/bench-diff.mts', 'repo/package-lock.json') }}

      - name: Snapshot base
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: repo
        env:
          BASE: ${{ steps.keys.outputs.base }}
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/corpora/.owasp-benchmark-java/src/main/java/org/owasp/benchmark/testcode"
          rm -rf "$GITHUB_WORKSPACE/base-snapshot"
          mkdir -p "$GITHUB_WORKSPACE/base-snapshot"
          bun .claude/skills/autofix-issues/bench-diff.mts pretree "$BASE" "$GITHUB_WORKSPACE/bench/pre-base"
          bun .claude/skills/autofix-issues/bench-diff.mts snapshot "$C" "$GITHUB_WORKSPACE/base-snapshot/owasp.json" \
            --src "$GITHUB_WORKSPACE/bench/pre-base/packages/circle-ir/src" \
            | tee "$GITHUB_WORKSPACE/base-snapshot/snapshot.log"

      - name: Snapshot head
        working-directory: repo
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/corpora/.owasp-benchmark-java/src/main/java/org/owasp/benchmark/testcode"
          bun .claude/skills/autofix-issues/bench-diff.mts snapshot "$C" "$GITHUB_WORKSPACE/bench/owasp-head.json" \
            | tee "$GITHUB_WORKSPACE/bench/head-snapshot.log"

      # bench-diff exits 1 when anything was removed outside --allow (there is
      # no --allow here); the gates below judge its saved output.
      - name: Diff base vs head
        working-directory: repo
        run: |
          set -uo pipefail
          bun .claude/skills/autofix-issues/bench-diff.mts diff \
            "$GITHUB_WORKSPACE/base-snapshot/owasp.json" "$GITHUB_WORKSPACE/bench/owasp-head.json" \
            --expected "$GITHUB_WORKSPACE/corpora/.owasp-benchmark-java/expectedresults-1.2.csv" \
            > "$GITHUB_WORKSPACE/bench/owasp-diff.txt" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            cat "$GITHUB_WORKSPACE/bench/owasp-diff.txt"
            echo "bench-diff diff exited $code" >&2
            exit 1
          fi
          grep -E '^(before|after|summary|detection-level|GATE):' "$GITHUB_WORKSPACE/bench/owasp-diff.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: engine-bench-owasp-diff
          path: |
            bench/owasp-diff.txt
            bench/head-snapshot.log
            base-snapshot/snapshot.log
          retention-days: 14
          if-no-files-found: warn

      # The release gate's judgement (as bench-candidate.mjs uses it): tp_loss only.
      - name: Gate - TP loss
        id: tp
        working-directory: repo
        run: |
          set -uo pipefail
          node scripts/bench-gate.mjs parse "$GITHUB_WORKSPACE/bench/owasp-diff.txt" | tee "$GITHUB_WORKSPACE/bench/tp-gate.txt"
          exit "${PIPESTATUS[0]}"

      - name: Gate - FP gain
        id: fp
        if: ${{ !cancelled() && steps.tp.conclusion != 'skipped' }}
        working-directory: repo
        run: |
          set -uo pipefail
          node scripts/bench-fp-gate.mjs parse "$GITHUB_WORKSPACE/bench/owasp-diff.txt" | tee "$GITHUB_WORKSPACE/bench/fp-gate.txt"
          exit "${PIPESTATUS[0]}"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          TP_OUTCOME: ${{ steps.tp.outcome }}
          FP_OUTCOME: ${{ steps.fp.outcome }}
          BASE_CACHED: ${{ steps.base-cache.outputs.cache-hit }}
          BASE: ${{ steps.keys.outputs.base }}
        run: |
          set -uo pipefail
          B="$GITHUB_WORKSPACE/bench"
          val() { grep -m1 -oE "(^| )$1=[0-9]+" "$B/owasp-diff.txt" 2>/dev/null | cut -d= -f2; }
          snap() { grep -m1 -oE '^snapshot: [0-9]+ files, [0-9]+ signatures, [0-9]+ errors, [0-9]+s' "$1" 2>/dev/null | sed 's/^snapshot: //'; }
          fp="$(grep -m1 -oE 'fp_gain=[0-9]+' "$B/fp-gate.txt" 2>/dev/null | cut -d= -f2)"
          {
            echo "## Engine bench: OWASP BenchmarkJava"
            echo
            echo "Base \`${BASE:0:12}\` vs head \`${GITHUB_SHA:0:12}\`. TP-loss gate: ${TP_OUTCOME:-not run}. FP-gain gate (max ${FP_GAIN_MAX}): ${FP_OUTCOME:-not run}."
            echo
            echo "| tp_loss | fp_gain | added | removed | reattributed | off_category | removed_outside_allow |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $(val tp_loss) | ${fp} | $(val added) | $(val removed) | $(val reattributed) | $(val off_category) | $(val removed_outside_allow) |"
            echo
            echo "- base snapshot: $(snap "$GITHUB_WORKSPACE/base-snapshot/snapshot.log")$([ "$BASE_CACHED" = 'true' ] && echo ' (cached)')"
            echo "- head snapshot: $(snap "$B/head-snapshot.log")"
            if grep -q '^bench-fp-gate: offending ' "$B/fp-gate.txt" 2>/dev/null; then
              echo
              echo "First offending additions on expected=false cases (file, signature):"
              echo
              echo '```'
              sed -n 's/^bench-fp-gate: offending //p' "$B/fp-gate.txt"
              echo '```'
            fi
            if grep -q '^TP-LOSS' "$B/owasp-diff.txt" 2>/dev/null; then
              echo
              echo "First TP-LOSS rows:"
              echo
              echo '```'
              grep '^TP-LOSS' "$B/owasp-diff.txt" | head -20 | tr -c 'A-Za-z0-9._/@:>=+\t\n-' '?'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
