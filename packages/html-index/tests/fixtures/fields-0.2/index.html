<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Field fixture</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/screen.css" media="screen and (min-width: 30em)">
<link rel="stylesheet" href="styles/gone.css">
<link rel="stylesheet" href="https://cdn.example/theme.css">
<style media="print">
.ticker { animation: none; }
</style>
</head>
<body>
<section id="news"><p id="ticker" class="ticker">Breaking: bread is warm</p></section>

<ol><li id="plain-li" style="text-decoration: underline dotted; color: red">Oat</li></ol>
<span id="spinner" class="spinner" tabindex="0">Loading</span>

<p id="quiet">Nothing moves here</p>
