lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      lodash:
        specifier: ^4.17.15
        version: 4.17.15
      react-dom:
        specifier: ^18.2.0
        version: 18.2.0(react@18.2.0)
      '@scope/pre':
        specifier: 1.0.0
        version: 1.0.0
    devDependencies:
      vitest:
        specifier: ^1.0.0
        version: 1.0.0
    optionalDependencies:
      fsevents:
        specifier: ^2.3.0
        version: 2.3.3

  packages/app:
    dependencies:
      '@acme/lib':
        specifier: workspace:*
        version: link:../lib
      semver:
        specifier: ^7.5.0
        version: 7.5.1

  packages/lib:
    dependencies:
      string-width-cjs:
        specifier: npm:string-width@^4.2.0
        version: string-width@4.2.3

packages:

  '@scope/pre@1.0.0':
    resolution: {integrity: sha512-a}

  fsevents@2.3.3:
    resolution: {integrity: sha512-b}

  lodash@4.17.15:
    resolution: {integrity: sha512-c}

  loose-envify@1.4.0:
    resolution: {integrity: sha512-d}

  react-dom@18.2.0:
    resolution: {integrity: sha512-e}
    peerDependencies:
      react: ^18.2.0

  react@18.2.0:
    resolution: {integrity: sha512-f}

  semver@7.5.1:
    resolution: {integrity: sha512-g}

  string-width@4.2.3:
    resolution: {integrity: sha512-h}

  tinyspy@2.2.0:
    resolution: {integrity: sha512-i}

  vitest@1.0.0:
    resolution: {integrity: sha512-j}

snapshots:

  '@scope/pre@1.0.0': {}

  fsevents@2.3.3:
    optional: true

  lodash@4.17.15: {}

  loose-envify@1.4.0: {}

  react-dom@18.2.0(react@18.2.0):
    dependencies:
      loose-envify: 1.4.0
      react: 18.2.0

  react@18.2.0:
    dependencies:
      loose-envify: 1.4.0

  semver@7.5.1: {}

  string-width@4.2.3: {}

  tinyspy@2.2.0: {}

  vitest@1.0.0:
    dependencies:
      tinyspy: 2.2.0
      lodash: 4.17.15
